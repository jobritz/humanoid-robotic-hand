<!doctype html>
<html lang='de'>
<head>
  <meta charset='utf-8'>
  <title>Hand-Simulation</title>
  <style>
    html, body { margin: 0; height: 100%; background: #111; color: #eee; font: 14px system-ui; }
    #sim { position: fixed; inset: 0; width: 100%; height: 100%; }
    #ui { position: fixed; left: 12px; top: 12px; display: flex; flex-direction: column; gap: 8px; width: 260px; }
    #camwrap { position: relative; width: 260px; height: 195px; background: #000; border-radius: 8px; overflow: hidden; }
    #camwrap video, #camwrap canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
    #camwrap video { transform: scaleX(-1); }
    button { padding: 6px 10px; }
    #status { white-space: pre; font: 12px monospace; }
  </style>
</head>
<body>
  <canvas id='sim'></canvas>
  <div id='ui'>
    <div id='camwrap'>
      <video id='cam' autoplay playsinline muted></video>
      <canvas id='overlay' width='640' height='480'></canvas>
    </div>
    <button id='start'>Kamera und Tracking starten</button>
    <button id='calOpen'>Kalibrieren: Hand flach</button>
    <button id='calFist'>Kalibrieren: Faust</button>
    <div id='status'></div>
  </div>
  <script type='module' src='/src/main.js'></script>
</body>
</html>
