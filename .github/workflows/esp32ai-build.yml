name: ESP32 AI Build

on:
  push:
    paths:
      - "esp/esp32ai/**"
      - ".github/workflows/esp32ai-build.yml"
  pull_request:
    paths:
      - "esp/esp32ai/**"
      - ".github/workflows/esp32ai-build.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build ESP32 AI project
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v6.1
          target: esp32
          path: esp/esp32ai
